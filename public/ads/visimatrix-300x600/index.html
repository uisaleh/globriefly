<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=300, height=600">
<meta name="robots" content="noindex, nofollow">
<title>VisiMatrix — animated ad 300×600</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&family=Doto:wght@900&display=swap">
<style>
  html, body { margin: 0; padding: 0; background: #14120b; }
  * { box-sizing: border-box; }
  .ad { position: relative; display: flex; flex-direction: column; width: 300px; height: 600px; overflow: hidden; border: 1px solid #dedacb; font-family: 'Geist', system-ui, sans-serif; color: #26251e; text-decoration: none; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  .top { background: #f6f4ec; padding: 20px 22px 18px; display: flex; flex-direction: column; gap: 12px; }
  .brand { display: flex; align-items: center; justify-content: space-between; }
  .brand-name { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
  .ad-tag { font-size: 9px; letter-spacing: .12em; color: #8f8978; }
  h1 { margin: 0; font-size: 28px; line-height: 1.06; font-weight: 700; letter-spacing: -0.035em; }
  h1 mark { background: #faecd6; color: inherit; padding: 0 5px; }
  .stage { flex: 1 1 auto; position: relative; background: #14120b; background-image: radial-gradient(rgba(248,189,100,.14) 1px, transparent 1.3px); background-size: 14px 14px; color: #f3f1ea; }
  .scene { position: absolute; inset: 16px 16px 24px; display: flex; flex-direction: column; gap: 8px; transition: opacity .45s ease, transform .45s ease; }
  .label { font-size: 9px; letter-spacing: .14em; }
  .bubble { align-self: flex-end; background: rgba(243,241,234,.09); padding: 9px 11px; font-size: 13px; line-height: 1.35; max-width: 220px; min-height: 18px; }
  .caret { display: inline-block; width: 7px; height: 13px; background: #f8bd64; margin-left: 2px; vertical-align: -2px; animation: blink 1s step-end infinite; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; font-size: 13.5px; border: 1px solid rgba(243,241,234,.14); transition: opacity .35s ease, transform .35s ease; }
  .row .n { font-size: 11px; opacity: .6; }
  .row .name { flex: 1; }
  .row .tag { font-size: 9px; letter-spacing: .08em; }
  .row.me { background: rgba(229,72,77,.12); color: #ff9a9d; border-color: rgba(229,72,77,.6); }
  .note { margin-top: 2px; font-size: 12px; line-height: 1.4; color: rgba(243,241,234,.7); transition: opacity .4s ease; }
  .how { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid rgba(243,241,234,.14); background: rgba(243,241,234,.04); transition: opacity .35s ease, transform .35s ease, border-color .35s ease; }
  .chip { width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; transition: background-color .3s ease, color .3s ease; }
  .how .t { font-size: 13.5px; font-weight: 500; display: block; }
  .how .d { font-size: 11.5px; line-height: 1.35; color: rgba(243,241,234,.65); display: block; margin-top: 2px; }
  .result { position: absolute; inset: 0 0 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; transition: opacity .45s ease, transform .45s ease; }
  .win { font-size: 10px; letter-spacing: .1em; background: #f8bd64; color: #26251e; padding: 5px 9px; transition: opacity .35s ease, transform .35s ease; }
  .gauge { position: relative; width: 160px; height: 160px; margin-bottom: -16px; }
  .gauge i { position: absolute; border-radius: 50%; }
  .gauge-text { position: absolute; inset: 0; padding-top: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .score { font-family: 'Doto', 'Geist Mono', monospace; font-weight: 900; font-size: 46px; line-height: 1; letter-spacing: -0.02em; }
  .muted { font-size: 9px; letter-spacing: .14em; color: rgba(243,241,234,.55); }
  .logos { display: flex; gap: 5px; }
  .logos span { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: #f7f7f4; border: 1px solid #dedacb; transition: opacity .3s ease, transform .3s ease; }
  .logos img { width: 15px; height: 15px; display: block; }
  .steps { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 6px; }
  .steps span { height: 4px; transition: width .3s ease, background-color .3s ease; }
  .bottom { background: #f6f4ec; padding: 16px 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cta { width: 100%; text-align: center; background: #f8bd64; color: #26251e; font-size: 15px; font-weight: 500; padding: 12px 10px; animation: pulse 1.8s ease-out infinite; }
  .ad:hover .cta, .ad:focus-visible .cta { background: #f5ad3f; }
  .ad:focus-visible { outline: 3px solid #f8bd64; outline-offset: -3px; }
  .foot { font-size: 10px; color: #6f6a5c; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(248,189,100,.55); } 60% { box-shadow: 0 0 0 10px rgba(248,189,100,0); } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cta, .caret { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<a class="ad" id="ad" href="https://visimatrix.com/" target="_blank" rel="noopener sponsored" aria-label="VisiMatrix: Is AI recommending your brand? Check your score free">
  <div class="top">
    <div class="brand">
      <span class="brand-name">
        <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" fill="#f8bd64"/><path d="M6.5 6H11.1L16 18.8L20.9 6H25.5L16 26L6.5 6Z" fill="#26251e"/></svg>
        VisiMatrix
      </span>
      <span class="mono ad-tag">AD</span>
    </div>
    <h1>Is AI recommending <mark>your brand?</mark></h1>
  </div>

  <div class="stage" aria-hidden="true">
    <div class="scene" id="sceneA">
      <span class="mono label" style="color: rgba(243,241,234,.5)">ASKING AN AI ASSISTANT…</span>
      <div class="bubble"><span id="typed"></span><span class="caret"></span></div>
      <div id="rows"></div>
      <span class="note" id="note">Missing from the answer? Here’s how we fix it →</span>
    </div>

    <div class="scene" id="sceneB">
      <span class="mono label" style="color: #f8bd64">HOW VISIMATRIX GETS YOU RECOMMENDED</span>
      <div id="how" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>

    <div class="result" id="sceneC">
      <span class="mono win" id="win">✓ NOW RECOMMENDED BY AI</span>
      <div class="gauge" id="gauge">
        <div class="gauge-text">
          <span class="score" id="score">0</span>
          <span class="mono muted">VISIBILITY SCORE</span>
        </div>
      </div>
      <span class="mono muted">TRACKED IN 7 AI ASSISTANTS</span>
      <div class="logos" id="logos"></div>
    </div>

    <div class="steps" id="steps"><span></span><span></span><span></span></div>
  </div>

  <div class="bottom">
    <span class="cta">Check your score free →</span>
    <span class="mono foot">visimatrix.com · no card required</span>
  </div>
</a>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var TICKS = 116;          // ~11.6 s per loop at 10 ticks per second
  var MAX_LOOPS = 3;        // then rest on the final frame (ad-friendly, saves CPU)
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Build the DOM once ----
  var list = [['01', '[Competitor A]', 19], ['02', '[Competitor B]', 22], ['03', '[Competitor C]', 25], ['—', 'Your brand', 29]];
  var rowEls = list.map(function (n, i) {
    var el = document.createElement('div');
    el.className = 'row' + (i === 3 ? ' me' : '');
    el.style.marginBottom = '8px';
    el.innerHTML = '<span class="mono n">' + n[0] + '</span><span class="name">' + n[1] + '</span><span class="mono tag">' + (i === 3 ? '✗ NOT MENTIONED' : '') + '</span>';
    $('rows').appendChild(el);
    return el;
  });

  var howData = [
    ['Track', 'Run your buyers’ prompts across 7 AI assistants.', 41],
    ['Find the gaps', 'See where competitors get cited and you don’t.', 46],
    ['Fix it', 'Copy-paste site fixes and a 90-day growth plan.', 51],
    ['Get recommended', 'Earn the listings, mentions and citations AI trusts.', 56]
  ];
  var howEls = howData.map(function (h, i) {
    var el = document.createElement('div');
    el.className = 'how';
    el.innerHTML = '<span class="mono chip"></span><div style="min-width:0"><span class="t">' + h[0] + '</span><span class="d">' + h[1] + '</span></div>';
    $('how').appendChild(el);
    return el;
  });

  // Dotted gauge: dot positions never change, only colour and opacity.
  var SIZE = 160, s = SIZE / 50, r = s * 0.34, c = SIZE / 2, outer = c - s * 0.6, inner = outer - SIZE * 0.12;
  var dots = [];
  var frag = document.createDocumentFragment();
  for (var gy = s / 2; gy < SIZE; gy += s) for (var gx = s / 2; gx < SIZE; gx += s) {
    var dx = gx - c, dy = gy - c, d = Math.sqrt(dx * dx + dy * dy);
    if (d < inner || d > outer) continue;
    var tt = ((((Math.atan2(dy, dx) * 180 / Math.PI) - 135) % 360) + 360) % 360 / 270;
    if (tt > 1) continue;
    var dot = document.createElement('i');
    dot.style.cssText = 'left:' + (gx - r).toFixed(1) + 'px;top:' + (gy - r).toFixed(1) + 'px;width:' + (2 * r).toFixed(1) + 'px;height:' + (2 * r).toFixed(1) + 'px';
    frag.appendChild(dot);
    dots.push({ el: dot, tt: tt });
  }
  $('gauge').insertBefore(frag, $('gauge').firstChild);

  var logos = [
    ['ChatGPT', '2bfd2bfaf0739328b6031d3d75a3faae'], ['Gemini', '1b36639cf561820aab0f10af33c18217'],
    ['Claude', '438cc6256f43ed717e00e40fb29a47a8'], ['Perplexity', 'db72d014437b6736ae564e5a17bcccfd'],
    ['DeepSeek', 'b48ca0268cecefd28c5088144dac35f6'], ['Mistral', '8bd4ce6b2731f764fe9afe0b1207e673'],
    ['Grok', '942f91120949a06e9eee43d39b7e6b71']
  ];
  var logoEls = logos.map(function (l) {
    var el = document.createElement('span');
    el.innerHTML = '<img src="assets/' + l[1] + '.svg" alt="' + l[0] + '" width="15" height="15">';
    $('logos').appendChild(el);
    return el;
  });
  var stepEls = $('steps').children;
  var prompt = 'What’s the best tool for [your category]?';

  function show(el, on, prop) {
    el.style.opacity = on ? 1 : 0;
    el.style.transform = on ? 'none' : prop;
  }

  // ---- Render one frame for tick t ----
  function render(t) {
    var scene = t < 38 ? 0 : t < 72 ? 1 : 2;

    // Scene 1 — the AI answer leaves your brand out
    $('typed').textContent = prompt.slice(0, Math.min(prompt.length, Math.max(0, Math.round((t - 2) * 2.4))));
    rowEls.forEach(function (el, i) { show(el, t >= list[i][2], 'translateY(8px)'); });
    $('note').style.opacity = t >= 32 ? 1 : 0;

    // Scene 2 — how VisiMatrix helps
    howEls.forEach(function (el, i) {
      var shown = t >= howData[i][2], done = t >= howData[i][2] + 4;
      show(el, shown, 'translateX(14px)');
      el.style.borderColor = done ? 'rgba(248,189,100,.45)' : 'rgba(243,241,234,.14)';
      var chip = el.firstChild;
      chip.textContent = done ? '✓' : String(i + 1);
      chip.style.background = done ? '#f8bd64' : 'rgba(243,241,234,.12)';
      chip.style.color = done ? '#26251e' : '#f3f1ea';
    });

    // Scene 3 — the result
    var g = Math.max(0, Math.min(72, (t - 76) * 3)), p = g / 100;
    dots.forEach(function (o) {
      var on = o.tt <= p && p > 0;
      o.el.style.background = on ? '#f8bd64' : 'rgba(243,241,234,.12)';
      o.el.style.opacity = on ? (0.5 + 0.5 * (o.tt / (p || 1))).toFixed(2) : 1;
    });
    $('score').textContent = g;
    logoEls.forEach(function (el, i) { show(el, t >= 82 + i * 2, 'translateY(6px)'); });
    show($('win'), t >= 101, 'translateY(6px)');

    // Scene switching
    show($('sceneA'), scene === 0, 'translateY(-12px)');
    show($('sceneB'), scene === 1, scene === 0 ? 'translateY(12px)' : 'translateY(-12px)');
    $('sceneC').style.opacity = scene === 2 ? 1 : 0;
    $('sceneC').style.transform = scene === 2 ? 'none' : 'scale(.94)';
    for (var i = 0; i < 3; i++) {
      stepEls[i].style.width = (scene === i ? 22 : 8) + 'px';
      stepEls[i].style.background = scene === i ? '#f8bd64' : 'rgba(243,241,234,.25)';
    }
  }

  // ---- Loop: only while visible on screen, max 3 loops, then hold the final frame ----
  var t = 0, loops = 0, timer = null, visible = true;
  function start() { if (!timer && visible && !document.hidden && loops < MAX_LOOPS) timer = setInterval(step, 100); }
  function stop() { clearInterval(timer); timer = null; }
  function step() {
    t++;
    if (t >= TICKS) { loops++; if (loops >= MAX_LOOPS) { stop(); render(TICKS - 1); return; } t = 0; }
    render(t);
  }

  if (reduced) { render(TICKS - 1); return; }
  render(0);
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) { visible = entries[0].isIntersecting; visible ? start() : stop(); }).observe($('ad'));
  }
  start();
})();
</script>
</body>
</html>
