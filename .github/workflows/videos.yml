name: Collect videos

# Refreshes the Watch section (content/videos.json). The news agent also does this every run.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: mkdir -p content/state && node agent/videos.mjs 2>&1 | tee content/state/videos.log
      - name: Save
        run: |
          git config user.name "Globriefly Desk"
          git config user.email "desk@users.noreply.github.com"
          git add content/videos.json content/state/videos.log
          if ! git diff --cached --quiet; then
            git commit -m "Update videos"
            git pull --rebase
            git push
          fi
