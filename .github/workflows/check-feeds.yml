name: Check news feeds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node agent/check-feeds.mjs
      - name: Save report
        run: |
          git config user.name "Globriefly Desk"
          git config user.email "desk@users.noreply.github.com"
          git add content/state/feeds-report.json content/state/feeds-report.txt
          if ! git diff --cached --quiet; then
            git commit -m "Feeds report"
            git pull --rebase
            git push
          fi
