name: Make link previews

# Renders the 1200×630 link-preview images (public/og/). New stories get one automatically;
# run this to create missing ones, or type story slugs (space-separated) to redo specific ones.
on:
  workflow_dispatch:
    inputs:
      stories:
        description: 'Optional — story slugs to redo (space-separated), or --all'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  og:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node agent/make-og.mjs $STORIES
        env:
          STORIES: ${{ github.event.inputs.stories }}
      - name: Save
        run: |
          git config user.name "Globriefly Desk"
          git config user.email "desk@users.noreply.github.com"
          git add public/og content/posts
          if ! git diff --cached --quiet; then
            git commit -m "Link preview images"
            git pull --rebase
            git push
          fi
