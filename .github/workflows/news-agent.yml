name: News agent

on:
  schedule:
    - cron: '7 * * * *' # every hour at :07 (UTC)
  workflow_dispatch:  # lets you run it by hand from the Actions tab
    inputs:
      categories:
        description: 'Optional — only these categories this run, e.g. science,entertainment'
        required: false
        default: ''
      count:
        description: 'Optional — how many stories this run (max 5)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: news-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      MAX_STORIES_PER_RUN: ${{ github.event.inputs.count || vars.MAX_STORIES_PER_RUN || '2' }}
      FOCUS_CATEGORIES: ${{ github.event.inputs.categories }}
      REQUIRE_REVIEW: ${{ vars.REQUIRE_REVIEW || 'false' }}
      GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      FB_LINK_IN: ${{ vars.FB_LINK_IN || 'comment' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Collect, write and publish stories
        timeout-minutes: 16
        run: |
          mkdir -p content/state
          set -o pipefail
          node agent/run.mjs 2>&1 | tee content/state/last-run.log

      - name: Commit new stories
        id: commit
        if: always()
        run: |
          git config user.name "Globriefly Desk"
          git config user.email "desk@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "News update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the site to deploy
        if: steps.commit.outputs.changed == 'true'
        run: sleep 180

      - name: Share to Facebook
        timeout-minutes: 8
        run: node agent/share.mjs

      - name: Save Facebook post IDs
        run: |
          git add content
          if ! git diff --cached --quiet; then
            git commit -m "Facebook shares $(date -u +'%H:%M UTC')"
            git pull --rebase
            git push
          fi
