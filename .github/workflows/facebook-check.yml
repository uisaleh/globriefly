name: Check Facebook connection

# Tests the FB_PAGE_ID / FB_PAGE_TOKEN secrets without posting anything.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node agent/fb-check.mjs
      - name: Save result
        run: |
          git config user.name "Globriefly Desk"
          git config user.email "desk@users.noreply.github.com"
          git add content/state/facebook-check.log
          if ! git diff --cached --quiet; then
            git commit -m "Facebook connection check"
            git pull --rebase
            git push
          fi
