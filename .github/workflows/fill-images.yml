name: Fill missing photos

# Actions → Fill missing photos → Run workflow. Finds licensed photos for stories published without one.
on:
  workflow_dispatch:
    inputs:
      pick:
        description: 'Optional — re-pick photos: slug=search words; slug2=search words (use | for a backup phrase)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node agent/fill-images.mjs "$PICK"
        env:
          PICK: ${{ github.event.inputs.pick }}
      - name: Save
        run: |
          git config user.name "Globriefly Desk"
          git config user.email "desk@users.noreply.github.com"
          git add content/posts
          if ! git diff --cached --quiet; then
            git commit -m "Add licensed photos to stories without one"
            git pull --rebase
            git push
          fi
