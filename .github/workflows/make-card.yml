name: Make photocard

# Actions → Make photocard → Run workflow → paste a story slug or link.
# The card and caption are saved to public/cards/ and appear on the site at /cards/<slug>.png within a minute or two.
on:
  workflow_dispatch:
    inputs:
      story:
        description: 'Story slug or full story link'
        required: true

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Render photocard and caption
        run: node agent/make-card.mjs "${{ github.event.inputs.story }}"
      - name: Save to the site
        run: |
          git config user.name "Globriefly Desk"
          git config user.email "desk@users.noreply.github.com"
          git add public/cards
          if ! git diff --cached --quiet; then
            git commit -m "Photocard: ${{ github.event.inputs.story }}"
            git pull --rebase
            git push
          fi
